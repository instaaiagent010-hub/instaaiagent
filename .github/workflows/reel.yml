name: Instagram Reels — PIB Video (3x Daily)

on:
  workflow_dispatch:  # Sirf manually trigger hogi, automatic nahi

jobs:
  reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --fix-missing fonts-noto fonts-noto-extra
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg-release-amd64-static.tar.xz
          sudo mv ffmpeg-*-static/ffmpeg /usr/local/bin/ffmpeg
          sudo mv ffmpeg-*-static/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version | head -1

      - name: Dependencies install
        run: pip install ddgs groq requests Pillow python-dotenv PyNaCl yt-dlp feedparser gTTS edge-tts

      - name: Post Reel
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python agent.py --reel
