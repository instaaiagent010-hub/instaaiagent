name: Instagram Reels — PIB Video (3x Daily)

on:
  schedule:
    - cron: '0 5 * * *'   # IST 10:30
    - cron: '0 10 * * *'  # IST 15:30
    - cron: '0 14 * * *'  # IST 19:30
  workflow_dispatch:

jobs:
  reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System dependencies
        run: sudo apt-get install -y --fix-missing fonts-noto fonts-noto-extra ffmpeg

      - name: Dependencies install
        run: pip install ddgs groq requests Pillow python-dotenv PyNaCl yt-dlp feedparser

      - name: Post Reel
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python agent.py --reel
