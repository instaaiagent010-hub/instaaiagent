name: Atlantis Space — Instagram Reels (10×/day)

on:
  schedule:
    - cron: '50 0 * * *'    # IST 06:20
    - cron: '20 2 * * *'    # IST 07:50
    - cron: '50 3 * * *'    # IST 09:20
    - cron: '20 5 * * *'    # IST 10:50
    - cron: '50 6 * * *'    # IST 12:20
    - cron: '20 8 * * *'    # IST 13:50
    - cron: '50 9 * * *'    # IST 15:20
    - cron: '50 11 * * *'   # IST 17:20
    - cron: '50 13 * * *'   # IST 19:20
    - cron: '50 15 * * *'   # IST 21:20
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System packages
        run: sudo apt-get install -y fonts-noto fonts-noto-extra ffmpeg

      - name: Dependencies install
        run: pip install ddgs groq requests Pillow python-dotenv PyNaCl gtts edge-tts

      - name: Configure git auth
        run: |
          git config --global user.email "bot@atlantisspace.ai"
          git config --global user.name "Atlantis Space Bot"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git

      - name: Post space news
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SPACE_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.SPACE_INSTAGRAM_ACCESS_TOKEN }}
          SPACE_INSTAGRAM_ACCOUNT_ID: ${{ secrets.SPACE_INSTAGRAM_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          SPACE_APP_ID: ${{ secrets.SPACE_APP_ID }}
          SPACE_APP_SECRET: ${{ secrets.SPACE_APP_SECRET }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python agent.py
