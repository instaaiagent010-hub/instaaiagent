name: Atlantis Finance — Instagram Reels (10×/day)

on:
  schedule:
    - cron: '0 1 * * *'     # IST 06:30
    - cron: '30 2 * * *'    # IST 08:00
    - cron: '0 4 * * *'     # IST 09:30
    - cron: '30 5 * * *'    # IST 11:00
    - cron: '0 7 * * *'     # IST 12:30
    - cron: '30 8 * * *'    # IST 14:00
    - cron: '30 10 * * *'   # IST 16:00
    - cron: '0 12 * * *'    # IST 17:30
    - cron: '0 14 * * *'    # IST 19:30
    - cron: '0 16 * * *'    # IST 21:30
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System packages
        run: sudo apt-get install -y fonts-noto fonts-noto-extra ffmpeg

      - name: Install dependencies
        run: pip install ddgs groq requests Pillow python-dotenv PyNaCl gtts edge-tts yt-dlp

      - name: Configure git
        run: |
          git config --global user.email "bot@atlantisfinance.ai"
          git config --global user.name "Atlantis Finance Bot"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git

      - name: Post Finance Reels
        env:
          GROQ_API_KEY:                         ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:                       ${{ secrets.PEXELS_API_KEY }}
          IMGBB_API_KEY:                        ${{ secrets.IMGBB_API_KEY }}
          PIXABAY_API_KEY:                      ${{ secrets.PIXABAY_API_KEY }}
          COINGECKO_API_KEY:                    ${{ secrets.COINGECKO_API_KEY }}
          GH_PAT:                               ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY:                    ${{ github.repository }}
          GITHUB_TOKEN:                         ${{ secrets.GITHUB_TOKEN }}
          FINANCE_INSTAGRAM_ACCESS_TOKEN:       ${{ secrets.FINANCE_INSTAGRAM_ACCESS_TOKEN }}
          FINANCE_INSTAGRAM_ACCOUNT_ID:         ${{ secrets.FINANCE_INSTAGRAM_ACCOUNT_ID }}
        run: python agent.py
